<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>散斑图片采集</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-gradient-to-br from-gray-50 to-gray-200 min-h-screen flex items-center justify-center p-4"
  >
    <div
      class="bg-white p-8 rounded-3xl shadow-2xl max-w-md w-full text-center border border-blue-200"
    >
      <h1 class="text-2xl font-extrabold text-blue-700 mb-6">散斑图片采集</h1>
      <!-- 树莓派配置区（同前） -->
      <div class="mb-6 text-left">
        <div class="mb-2 flex flex-col gap-2">
          <div class="flex items-center">
            <label class="font-medium w-24">树莓派IP:</label>
            <input
              id="rasp_ip"
              class="border rounded px-2 py-1 flex-1 min-w-0"
              placeholder="192.168.x.x"
              value="{{ default_ip }}"
            />
          </div>
          <div class="flex items-center">
            <label class="font-medium w-24">用户名:</label>
            <input
              id="rasp_user"
              class="border rounded px-2 py-1 flex-1 min-w-0"
              value="{{ default_user }}"
            />
          </div>
          <div class="flex items-center">
            <label class="font-medium w-24">密码:</label>
            <input
              id="rasp_pwd"
              type="password"
              class="border rounded px-2 py-1 flex-1 min-w-0"
            />
          </div>
          <div>
            <button
              id="check_net"
              class="px-3 py-1 bg-blue-100 text-blue-700 rounded hover:bg-blue-200 w-32"
            >
              网络检测
            </button>
          </div>
        </div>
        <div id="net_status" class="mt-2 text-sm"></div>
      </div>
      <div class="mb-4">
        <button
          id="upload_script_btn"
          class="px-4 py-1 bg-green-100 text-green-700 rounded hover:bg-green-200 w-48"
        >
          上传拍照脚本到树莓派
        </button>
        <div id="upload_status" class="mt-2 text-sm"></div>
      </div>
      <!-- 目录创建区 -->
      <div class="mb-4 text-left">
        <label class="font-medium">新建采集目录：</label>
        <div class="flex gap-2 mt-2">
          <input
            id="new_dir_name"
            class="border rounded px-2 py-1 flex-1 min-w-0"
            placeholder="如 RedOakHardwood"
          />
          <button
            id="create_dir_btn"
            class="px-4 py-1 bg-blue-100 text-blue-700 rounded hover:bg-blue-200"
          >
            创建目录
          </button>
        </div>
        <div id="create_dir_status" class="mt-2 text-sm"></div>
      </div>
      <!-- 目录选择区 -->
      <div class="mb-4 text-left">
        <label class="font-medium">选择采集目录：</label>
        <select
          id="dir_select"
          class="border rounded px-2 py-1 w-full mt-2"
        ></select>
      </div>
      <!-- 采集操作区 -->
      <div class="mb-6">
        <button
          id="collect_btn"
          class="px-6 py-2 bg-blue-600 text-white rounded-lg font-bold hover:bg-blue-700"
        >
          采集图片
        </button>
      </div>
      <div id="collect_status" class="text-blue-600 font-medium"></div>
      <div id="raspberry_log" class="text-gray-500 text-xs mt-2"></div>
    </div>
    <script>
      // 网络检测、上传脚本同前略...
      // 目录列表刷新
      function refreshDirList(selected) {
        fetch("/list_speckle_dirs")
          .then((r) => r.json())
          .then((d) => {
            const sel = document.getElementById("dir_select");
            sel.innerHTML = "";
            d.dirs.forEach((dir) => {
              const opt = document.createElement("option");
              opt.value = dir;
              opt.text = dir;
              if (selected && dir === selected) opt.selected = true;
              sel.appendChild(opt);
            });
          });
      }
      refreshDirList();
      // 创建目录
      const createBtn = document.getElementById("create_dir_btn");
      createBtn.onclick = function () {
        const name = document.getElementById("new_dir_name").value.trim();
        if (!name) {
          document.getElementById("create_dir_status").innerText =
            "请输入目录名称";
          return;
        }
        fetch("/create_speckle_dir", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name }),
        })
          .then((r) => r.json())
          .then((d) => {
            document.getElementById("create_dir_status").innerText = d.msg;
            if (d.success) {
              refreshDirList(d.dir);
              document.getElementById("new_dir_name").value = "";
            }
          });
      };
      // 采集图片
      const collectBtn = document.getElementById("collect_btn");
      collectBtn.onclick = function () {
        const dir = document.getElementById("dir_select").value;
        const ip = document.getElementById("rasp_ip").value;
        const username = document.getElementById("rasp_user").value;
        const password = document.getElementById("rasp_pwd").value;
        if (!dir) {
          document.getElementById("collect_status").innerText =
            "请选择采集目录";
          return;
        }
        document.getElementById("collect_status").innerText = "采集中...";
        document.getElementById("raspberry_log").innerText = "";
        fetch("/collect_speckle", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ subdir: dir, ip, username, password }),
        })
          .then((r) => r.json())
          .then((d) => {
            document.getElementById("collect_status").innerText = d.msg;
            if (d.raspberry_log)
              document.getElementById("raspberry_log").innerText =
                d.raspberry_log;
          });
      };
    </script>
  </body>
</html>
